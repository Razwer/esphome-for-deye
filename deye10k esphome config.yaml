# Optimized for LILYGO® TTGO T-CAN485 ESP32
substitutions:
  name: deye
  device_description: "Esphome component for Deye sun-sg05lp3"
  modbus_controller_id: sg05lp3

esphome:
  name: deye-inverter
  friendly_name: Deye Inverter

esp32:
  board: esp32dev
  framework:
    type: arduino #esp-idf doesn't work well with modbus.

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "PYvmTOENcnBjsdeOU1ie6nX+fWwjfBfBlD6qJIynhgo="

ota:
  - platform: esphome
    password: "6eae1fe922c30d5c492a92cb1d3a2de6"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: "192.168.1.159"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Deye-Inverter Fallback Hotspot"
    password: "lSbdfqBGCIyp"

captive_portal:

uart:
  id: mod_bus
  tx_pin: 22 # GPIO22 is used for RS485 TX on the LILYGO® TTGO T-CAN485 ESP32 board
  rx_pin: 21 # GPIO21 is used for RS485 RX on the LILYGO® TTGO T-CAN485 ESP32 board
  baud_rate: 9600
  stop_bits: 1
 
modbus:
  id: modbus1
  flow_control_pin: 17 # GPIO17 is used for RS485 direction control on the LILYGO® TTGO T-CAN485 ESP32 board. It should be set to HIGH for transmitting data and LOW for receiving data.
 
modbus_controller:
  - id: ${modbus_controller_id}
    address: 0x1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 8sec
  
switch:
  - platform: gpio
    pin: 16
    id: lilygo_5v_en
    restore_mode: ALWAYS_ON
    internal: true
    
  - platform: gpio
    pin: 19
    id: lilygo_rs485_en
    restore_mode: ALWAYS_ON
    internal: true

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: sun3p_Solar_sell
    register_type: holding
    address: 145
    bitmask: 1
    entity_category: config
    icon: "mdi:toggle-switch"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}  
    name: sun3p-Peak_Shaving_mode
    register_type: holding
    address: 178
    bitmask: 0x10  # Bit 4 controls the Peak Shaving toggle on 3-phase models
    entity_category: config
    icon: "mdi:flash-outline"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: sun3p-Grid_Charge
    register_type: holding
    address: 130
    bitmask: 1
    entity_category: config
    icon: "mdi:toggle-switch"
 
  - platform: modbus_controller  # Advanced peak shaving and valley filling function enabled
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: sun3p-Time of Use 
    id: sun3p_Time_of_Use
    register_type: holding
    address: 146
    bitmask: 1
    entity_category: config
    icon: "mdi:toggle-switch"
 
  - platform: modbus_controller  # Time point 1 charge enable - grid charging enable
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: sun3p-Time point 1 charge enable
    register_type: holding
    address: 172
    bitmask: 1   # 2 if you want Gen charging enabled instead..
    entity_category: config
    icon: "mdi:toggle-switch"
 
  - platform: modbus_controller  # Time point 2 charge enable - grid charging enable
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: sun3p-Time point 2 charge enable
    register_type: holding
    address: 173
    bitmask: 1    # 2 if you want Gen charging enabled instead..
    entity_category: config
    icon: "mdi:toggle-switch"
 
  - platform: modbus_controller  # Time point 3 charge enable - grid charging enable
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: sun3p-Time point 3 charge enable
    register_type: holding
    address: 174
    bitmask: 1    # 2 if you want Gen charging enabled instead.
    entity_category: config
    icon: "mdi:toggle-switch"
 
  - platform: modbus_controller  # Time point 4 charge enable - grid charging enable
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: sun3p-Time point 4 charge enable
    register_type: holding
    address: 175
    bitmask: 1    # 2 if you want Gen charging enabled instead.
    entity_category: config
    icon: "mdi:toggle-switch"
 
  - platform: modbus_controller  # Time point 5 charge enable - grid charging enable
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: sun3p-Time point 5 charge enable
    register_type: holding
    address: 176
